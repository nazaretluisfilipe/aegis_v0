name: Aegis - verificacao da Fase 1
on:
  push:
    branches: [entrega-admin-etapa1, desenvolvimento-portal-responsavel, desenvolvimento-mvp-20261012, 'feat/**']
  pull_request:
    branches: [desenvolvimento-mvp-20261012]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript e build
        run: npm run build
      - name: Testar autenticação, autorização e operação
        run: npm test
