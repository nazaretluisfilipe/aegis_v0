name: Aegis - verificacao da Fase 1
on:
  push:
    branches: [entrega-admin-etapa1]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript e build
        run: npm run build
      - name: Testar permissoes da etapa anterior
        run: node supabase/tests/admin.test.mjs
      - name: Testar cadastros e RLS da Fase 1
        run: node supabase/tests/families.test.mjs
