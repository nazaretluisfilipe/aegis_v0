name: Aegis - verificacao da Fase 1
on:
  push:
    branches: [main, entrega-admin-etapa1, desenvolvimento-portal-responsavel, desenvolvimento-mvp-20261012]
  pull_request:
    branches: [main, desenvolvimento-mvp-20261012]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript e build
        run: npm run build
      - name: Testar autenticação, autorização e operação
        run: npm test

  browser_publico:
    name: Smoke test público (desktop e celular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências e Playwright temporário
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Validar a homepage desta branch em navegador local, sem leads reais
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aegis-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          AEGIS_BASE_URL=http://127.0.0.1:4173 node scripts/landing-local-browser-smoke.mjs
          AEGIS_BASE_URL=http://127.0.0.1:4173 node scripts/browser-engine-smoke.mjs
      - name: Navegar pelo site oficial sem criar clientes
        run: |
          node scripts/public-browser-smoke.mjs
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            node scripts/responsive-browser-smoke.mjs
          fi
        env:
          AEGIS_BASE_URL: https://www.aegisedu.com.br
      - name: Guardar capturas públicas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-capturas-responsivas
          path: artifacts/responsive/
          if-no-files-found: ignore
          retention-days: 7

  security_history:
    name: Verificar segredos no histórico Git (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Auditar histórico completo de commits (todos os refs)
        run: |
          set -euo pipefail
          version=8.24.3
          file="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          curl -fsSLo /tmp/gitleaks-checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          (cd /tmp && grep " ${file}$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${file}" -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --log-opts="--all" --exit-code=2
